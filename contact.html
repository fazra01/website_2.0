<!doctype html>
<html lang="en">

<head>

  <title>contact — Fadi Azra</title>

  <link rel="stylesheet" href="contact.css">
  <link rel="stylesheet" href="transitions.css">

<body>

  <div id="swup" class="transition-fade">

    <main class="contact-page">

      <section class="contact-layout">

        <figure class="contact-video-wrap">
          <video
            class="contact-video"
            autoplay
            muted
            loop
            playsinline
            preload="metadata"
          >
            <source
              src="video/painting.mp4"
              type="video/mp4"
            >
          </video>
        </figure>


        <div class="contact-info">

          <p class="contact-label">
            contact
          </p>
            <p class="contact-text">
                For inquiries, commissions, or collaborations, please reach out via email or connect with me on social media.
            </p>
          <nav class="contact-links">

            <a href="mailto:fadiazra8@gmail.com">
              email
            </a>

            <a
              href="https://www.instagram.com/fadi_azra_art"
              target="_blank"
              rel="noopener"
            >
              instagram
            </a>

            <a
              href="https://www.linkedin.com/in/fadi-azra-b62723335"
              target="_blank"
              rel="noopener"
            >
              linkedin
            </a>

          </nav>

        </div>

      </section>

    </main>

  </div>


  <script src="https://unpkg.com/swup@4"></script>
  <script src="https://unpkg.com/@swup/head-plugin@2"></script>

  <script src="home.js"></script>
  <script src="artist-statement.js"></script>
  <script src="swup-init.js"></script>

</body>

</html>
