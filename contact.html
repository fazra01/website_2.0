<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>contact — Fadi Azra</title>

  <link rel="stylesheet" href="contact.css">
  <link rel="stylesheet" href="transitions.css">
</head>

<body>

  <div id="swup" class="transition-fade">

    <main class="contact-page">

      <section class="contact-layout">

        <figure class="contact-video-wrap">
          <video
            class="contact-video"
            autoplay
            muted
            loop
            playsinline
            preload="metadata"
          >
            <source
              src="video/painting.mp4"
              type="video/mp4"
            >
          </video>
        </figure>


        <div class="contact-info">
           <p class="contact-text">
            For inquiries, commissions, or collaborations, send me a message or connect with me on social media.
            </p>
          <form
  class="contact-form"
  id="contactForm"
  action="https://formspree.io/f/xvkpqyla
  method="POST"
>

  <label for="contactEmail">
    your email
  </label>

  <input
    id="contactEmail"
    type="email"
    name="email"
    autocomplete="email"
    required
  >


  <label for="contactMessage">
    your message
  </label>

  <textarea
    id="contactMessage"
    name="message"
    rows="3"
    required
  ></textarea>


  <button type="submit">
    send →
  </button>

  <p
    class="contact-status"
    id="contactStatus"
    aria-live="polite"
  ></p>

</form>


<nav class="contact-links">

  <a
    href="https://www.instagram.com/fadi_azra_art"
    target="_blank"
    rel="noopener"
  >
    instagram
  </a>

  <a
    href="https://www.linkedin.com/in/fadi-azra-b62723335"
    target="_blank"
    rel="noopener"
  >
    linkedin
  </a>

</nav>
        </div>

      </section>

    </main>

  </div>


  <script src="https://unpkg.com/swup@4"></script>
  <script src="https://unpkg.com/@swup/head-plugin@2"></script>

  <script src="home.js"></script>
  <script src="artist-statement.js"></script>
  <script src="swup-init.js"></script>

</body>

</html>
